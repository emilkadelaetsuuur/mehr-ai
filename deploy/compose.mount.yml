# Release without an image build: the code is mounted over the image that already holds the dependencies.
# Use it when requirements.txt has not changed, or when building on the server is not wanted
# (on 2026-11-18 an image build on this host crashed the Docker daemon and took every site down with it):
#   docker compose -f docker-compose.yml -f deploy/compose.mount.yml up -d --no-build
# Back to the code baked into the image:  docker compose -f docker-compose.yml up -d --no-build
services:
  app:
    volumes:
      - appdata:/data
      - ./app:/srv/app:ro
      - ./web:/srv/web:ro
      - ./scripts:/srv/scripts:ro
      - ./tests:/srv/tests:ro
      - ./pytest.ini:/srv/pytest.ini:ro
