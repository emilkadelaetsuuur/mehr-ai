# Выкладка без сборки образа: код монтируется поверх образа, в котором уже стоят зависимости.
# Нужна, когда requirements.txt не менялся или собирать образ на сервере нельзя
# (18.11.2026 сборка образа на этом сервере уронила Docker и вместе с ним все сайты):
#   docker compose -f docker-compose.yml -f deploy/compose.mount.yml up -d --no-build
# Вернуться к коду внутри образа:  docker compose -f docker-compose.yml up -d --no-build
services:
  app:
    volumes:
      - appdata:/data
      - ./app:/srv/app:ro
      - ./web:/srv/web:ro
      - ./scripts:/srv/scripts:ro
      - ./tests:/srv/tests:ro
      - ./pytest.ini:/srv/pytest.ini:ro
      - ./requirements.txt:/srv/requirements.txt:ro
